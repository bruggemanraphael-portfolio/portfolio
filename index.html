<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="./assets/css/portfolio.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,1,0&icon_names=dark_mode,light_mode" />
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body id="app">
        
    <main class="wrapper-container">
        <div class="header">
            <div class="hamburger"><hr><hr><hr></div> 
            <nav>
                <ul>
                    <li><a href="#introduction">Profil</a></li>
                    <li><a href="#projets">Projets</a></li>
                    <li><a href="#missions">Experiences<br>professionnelle</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
            <span class="toggle-theme-btn material-symbols-outlined" alt="Toggle light/dark theme">light_mode</span>
        </div>
        <div id="introduction">
            <section>
                <div class="introduction"></div>
            </section>
        </div>
        <div id="projets">
            <section>
                <div class="projects"></div>
            </section>
        </div>
        <div id="contact">
            <section>
                <form id="contact-form" >
                    <div class="name">
                        <label for="name">Nom / Société</label>
                        <input type="text" id="name" name="name" autocomplete="name" minlength="2" maxlength="80" required >
                        <h6 class="error-message">champs requis</h6>
                    </div>
                    
                    <div class="email">
                        <label for="email">Adresse électronique</label>
                        <input type="email" id="email" name="email" autocomplete="email" maxlength="254" required >
                        <h6 class="error-message">champs requis</h6>
                    </div>
                    
                    <div class="message">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" minlength="10" maxlength="1500" required></textarea>
                        <h6 class="error-message">champs requis</h6>
                    </div>

                    <div class="website-field" aria-hidden="true">
                        <label for="website">Site web</label>
                        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
                    </div>
                    
                    <button type="submit">Envoyer</button>
                    <h6 class="form-message" role="status" aria-live="polite"></h6>
                </form>
                
                <!-- <p>Email <a href="mailto:raphael.bruggeman@hotmail.com">raphael.bruggeman@hotmail.com</a></p>
                <p>GSM <a href="tel:+32473485028">+32 0473/48.50.28</a></p>
                <p>LinkedIn <a href="https://www.linkedin.com/in/bruggemanraphael">Raphael Bruggeman</a></p> -->
            </section>
        </div>
    </main>
    <script type="module" src="portfolio.js"></script>
</body>
</html>
